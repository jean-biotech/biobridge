title: BioBridge
email: jeans.connects@gmail.com
description: A student-led biotech access initiative bridging the gap between curiosity and careers in biotechnology.
url: "https://biotechbridge.org"
baseurl: ""

# Logo
logo: "/assets/images/BioBridge.png"

# Theme
remote_theme: mmistakes/minimal-mistakes@4.26.2
minimal_mistakes_skin: default

# Site Author
author:
  name: "BioBridge"
  bio: "Making biotech accessible to everyone"
  avatar: "https://raw.githubusercontent.com/jean-biotech/biobridge/main/assets/images/BioBridge.png"

# Build settings
markdown: kramdown
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag

include:
  - _pages

defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: false

# Social links, rendered as plain text in the custom footer (see
# _includes/footer/custom.html). No icon fonts.
social_links:
  - label: "GitHub"
    url: "https://github.com/jean-biotech/biobridge"
  - label: "Instagram"
    url: "https://instagram.com/jeans.scenes"
  - label: "LinkedIn"
    url: "https://linkedin.com/in/jeantrann"
  - label: "Email"
    url: "mailto:jeans.connects@gmail.com"
